<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matéria — Nome do Curso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12162A; --paper:#F7F4EC; --paper-2:#EDE7D6;
  --gold:#B8912B; --gold-soft:#D9BC6E; --teal:#1F5F5B; --teal-dark:#12403D;
  --text:#22263D; --muted:#666B80; --line:rgba(18,22,42,0.13); --line-strong:rgba(18,22,42,0.22);
  --radius:16px; --radius-lg:22px;
  --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
body{margin:0; font-family:var(--font-body); color:var(--text); background:var(--paper); min-height:100vh;}
h1,h2{font-family:var(--font-display); margin:0; color:var(--ink);}
a{color:inherit; text-decoration:none;}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}

.topbar{display:flex; align-items:center; justify-content:space-between; padding:26px 40px;}
.brand{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:600; font-size:18px;}
.brand .dot{color:var(--gold); font-size:22px; line-height:0;}
.logout-link{font-size:13.5px; font-weight:600; color:var(--muted);}
.logout-link:hover{color:var(--ink);}

.wrap{max-width:620px; margin:0 auto; padding:20px 24px 80px;}
.back-row{margin-bottom:20px;}
.back-row a{font-size:13.5px; font-weight:600; color:var(--muted); display:inline-flex; align-items:center; gap:6px;}
.back-row a:hover{color:var(--ink);}

.mat-header{margin-bottom:26px;}
.mat-header .eyebrow{font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--teal-dark); font-weight:600;}
.mat-header h1{font-size:clamp(22px,3.2vw,28px); font-weight:600; margin-top:10px;}

.progress-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius-lg); padding:22px 24px; margin-bottom:26px;}
.progress-card .plabel{font-size:13.5px; color:var(--muted); margin-bottom:10px; font-weight:600;}
.ascii-bar{font-family:var(--font-mono); font-size:16px; letter-spacing:1px; color:var(--teal); display:flex; align-items:baseline; gap:10px;}
.ascii-bar .pct-num{color:var(--ink); font-size:14px; font-weight:700;}

.aula-list{display:flex; flex-direction:column; gap:12px; margin-bottom:30px;}
.aula-card{
  display:flex; align-items:center; gap:16px; background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 20px; transition:transform .15s ease, box-shadow .15s ease;
}
.aula-card:hover{transform:translateY(-3px); box-shadow:0 18px 36px -24px rgba(18,22,42,0.35);}
.aula-icon{font-size:20px; flex-shrink:0;}
.aula-info{flex:1;}
.aula-info .atitle{font-size:15px; font-weight:600; color:var(--ink);}
.aula-info .astatus{font-size:13px; color:var(--muted); margin-top:3px;}
.aula-info .astatus.done{color:var(--teal-dark); font-weight:600;}
.aula-info .astatus.not-started{color:var(--muted); font-style:italic;}
.aula-arrow{color:var(--muted); font-size:18px; flex-shrink:0;}

.prova-section{background:var(--paper-2); border:1px solid var(--line); border-radius:var(--radius-lg); padding:22px 24px;}
.prova-section h4{font-size:15.5px; font-weight:600; color:var(--ink); margin-bottom:6px;}
.prova-section p{color:var(--muted); font-size:13.5px; margin-bottom:14px;}
.prova-section a{display:inline-flex; background:var(--teal); color:#fff; padding:11px 20px; border-radius:999px; font-weight:700; font-size:13.5px;}
.prova-nota{font-family:var(--font-mono); font-size:12.5px; color:var(--teal-dark); margin-bottom:10px; display:inline-block;}
.empty-note{color:var(--muted); font-size:14px;}

@media (max-width:560px){
  .topbar{padding:20px 22px;}
  .wrap{padding:10px 20px 60px;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot">•</span>Nome do Curso</div>
  <a href="index.html" class="logout-link">Sair</a>
</div>

<div class="wrap">
  <div class="back-row"><a href="#" id="backLink">← Voltar ao módulo</a></div>

  <div class="mat-header">
    <span class="eyebrow" id="modLabel">Módulo</span>
    <h1 id="matTitle">Matéria</h1>
  </div>

  <div class="progress-card">
    <div class="plabel" id="progressLabel">Progresso da matéria: 0%</div>
    <div class="ascii-bar"><span id="asciiBar"></span><span class="pct-num" id="pctLabel">0%</span></div>
  </div>

  <div class="aula-list" id="aulaList"></div>

  <div class="prova-section" id="provaSection"></div>
</div>

<script>
/* ============ MODELO DE DADOS ============
   Curso -> Módulos -> Matérias (até 8 por módulo) -> Aulas (até 12 por matéria)
   Aluno possui Progresso individual em cada Aula (fonte única de verdade).
   A estrutura do curso é editável pelo coordenador em coordenador.html e fica salva no storage —
   o objeto abaixo é só a semente usada na primeira visita. */
const DEFAULT_CURSO_ESTRUTURA = {
  id:'curso-1', nome:'Nome do Curso',
  modulos:[
    { id:'mod-1', nome:'Fundamentos', materias:[
        { id:'mod-1-mat-1', nome:'Introdução e visão geral', aulas:[ { id:'mod-1-mat-1-aula-1', nome:'Aula 1', duracao:'08 min', descricao:'', videoUrl:'', apostilaUrl:'', slidesUrl:'' } ]},
        { id:'mod-1-mat-2', nome:'Conceitos essenciais', aulas:[ { id:'mod-1-mat-2-aula-1', nome:'Aula 1', duracao:'14 min', descricao:'', videoUrl:'', apostilaUrl:'', slidesUrl:'' } ]},
        { id:'mod-1-mat-3', nome:'Ferramentas utilizadas no curso', aulas:[ { id:'mod-1-mat-3-aula-1', nome:'Aula 1', duracao:'10 min', descricao:'', videoUrl:'', apostilaUrl:'', slidesUrl:'' } ]},
        { id:'mod-1-mat-4', nome:'Exercício prático de fixação', aulas:[ { id:'mod-1-mat-4-aula-1', nome:'Aula 1', duracao:'12 min', descricao:'', videoUrl:'', apostilaUrl:'', slidesUrl:'' } ]}
    ]},
    { id:'mod-2', nome:'Ferramentas e prática', materias:[
        { id:'mod-2-mat-1', nome:'Configuração do ambiente/ferramentas', aulas:[ { id:'mod-2-mat-1-aula-1', nome:'Aula 1', duracao:'09 min', descricao:'', videoUrl:'', apostilaUrl:'', slidesUrl:'' } ]},
        { id:'mod-2-mat-2', nome:'Prática guiada', aulas:[ { id:'mod-2-mat-2-aula-1', nome:'Aula 1', duracao:'16 min', descricao:'', videoUrl:'', apostilaUrl:'', slidesUrl:'' } ]},
        { id:'mod-2-mat-3', nome:'Estudo de caso', aulas:[ { id:'mod-2-mat-3-aula-1', nome:'Aula 1', duracao:'11 min', descricao:'', videoUrl:'', apostilaUrl:'', slidesUrl:'' } ]},
        { id:'mod-2-mat-4', nome:'Erros comuns e como evitá-los', aulas:[ { id:'mod-2-mat-4-aula-1', nome:'Aula 1', duracao:'07 min', descricao:'', videoUrl:'', apostilaUrl:'', slidesUrl:'' } ]},
        { id:'mod-2-mat-5', nome:'Exercício prático', aulas:[ { id:'mod-2-mat-5-aula-1', nome:'Aula 1', duracao:'13 min', descricao:'', videoUrl:'', apostilaUrl:'', slidesUrl:'' } ]}
    ]},
    { id:'mod-3', nome:'Projeto aplicado', materias:[
        { id:'mod-3-mat-1', nome:'Planejamento do projeto', aulas:[ { id:'mod-3-mat-1-aula-1', nome:'Aula 1', duracao:'10 min', descricao:'', videoUrl:'', apostilaUrl:'', slidesUrl:'' } ]},
        { id:'mod-3-mat-2', nome:'Desenvolvimento — parte 1', aulas:[ { id:'mod-3-mat-2-aula-1', nome:'Aula 1', duracao:'18 min', descricao:'', videoUrl:'', apostilaUrl:'', slidesUrl:'' } ]},
        { id:'mod-3-mat-3', nome:'Desenvolvimento — parte 2', aulas:[ { id:'mod-3-mat-3-aula-1', nome:'Aula 1', duracao:'18 min', descricao:'', videoUrl:'', apostilaUrl:'', slidesUrl:'' } ]},
        { id:'mod-3-mat-4', nome:'Revisão e ajustes finais', aulas:[ { id:'mod-3-mat-4-aula-1', nome:'Aula 1', duracao:'09 min', descricao:'', videoUrl:'', apostilaUrl:'', slidesUrl:'' } ]}
    ]},
    { id:'mod-4', nome:'Avançado', materias:[
        { id:'mod-4-mat-1', nome:'Tópico avançado 1', aulas:[ { id:'mod-4-mat-1-aula-1', nome:'Aula 1', duracao:'14 min', descricao:'', videoUrl:'', apostilaUrl:'', slidesUrl:'' } ]},
        { id:'mod-4-mat-2', nome:'Tópico avançado 2', aulas:[ { id:'mod-4-mat-2-aula-1', nome:'Aula 1', duracao:'14 min', descricao:'', videoUrl:'', apostilaUrl:'', slidesUrl:'' } ]},
        { id:'mod-4-mat-3', nome:'Tópico avançado 3', aulas:[ { id:'mod-4-mat-3-aula-1', nome:'Aula 1', duracao:'15 min', descricao:'', videoUrl:'', apostilaUrl:'', slidesUrl:'' } ]},
        { id:'mod-4-mat-4', nome:'Boas práticas de mercado', aulas:[ { id:'mod-4-mat-4-aula-1', nome:'Aula 1', duracao:'11 min', descricao:'', videoUrl:'', apostilaUrl:'', slidesUrl:'' } ]},
        { id:'mod-4-mat-5', nome:'Exercício prático', aulas:[ { id:'mod-4-mat-5-aula-1', nome:'Aula 1', duracao:'12 min', descricao:'', videoUrl:'', apostilaUrl:'', slidesUrl:'' } ]}
    ]},
    { id:'mod-5', nome:'[Nome do módulo 5]', materias:[
        { id:'mod-5-mat-1', nome:'[Matéria a definir]', aulas:[ { id:'mod-5-mat-1-aula-1', nome:'[Aula a definir]', duracao:'— min', descricao:'', videoUrl:'', apostilaUrl:'', slidesUrl:'' } ]}
    ]},
    { id:'mod-6', nome:'[Nome do módulo 6]', materias:[
        { id:'mod-6-mat-1', nome:'[Matéria a definir]', aulas:[ { id:'mod-6-mat-1-aula-1', nome:'[Aula a definir]', duracao:'— min', descricao:'', videoUrl:'', apostilaUrl:'', slidesUrl:'' } ]}
    ]}
  ]
};

// Progresso padrão de demonstração (0-100 por AULA) — usado apenas para semear o storage na primeira visita.
const DEFAULT_PROGRESS = {
  'mod-1-mat-1-aula-1':80, 'mod-1-mat-2-aula-1':45, 'mod-1-mat-3-aula-1':100, 'mod-1-mat-4-aula-1':0,
  'mod-2-mat-1-aula-1':100, 'mod-2-mat-2-aula-1':20, 'mod-2-mat-3-aula-1':0, 'mod-2-mat-4-aula-1':0, 'mod-2-mat-5-aula-1':0,
  'mod-3-mat-1-aula-1':0, 'mod-3-mat-2-aula-1':0, 'mod-3-mat-3-aula-1':0, 'mod-3-mat-4-aula-1':0,
  'mod-4-mat-1-aula-1':0, 'mod-4-mat-2-aula-1':0, 'mod-4-mat-3-aula-1':0, 'mod-4-mat-4-aula-1':0, 'mod-4-mat-5-aula-1':0,
  'mod-5-mat-1-aula-1':0,
  'mod-6-mat-1-aula-1':0
};

async function storageGet(key, shared){
  if (window.storage){
    try { const res = await window.storage.get(key, shared); return res ? res.value : null; }
    catch(e){ return null; }
  }
  try { return localStorage.getItem((shared ? 'shared:' : 'user:') + key); } catch(e){ return null; }
}
async function storageSet(key, value, shared){
  if (window.storage){
    try { await window.storage.set(key, value, shared); return; } catch(e){ /* cai para localStorage abaixo */ }
  }
  try { localStorage.setItem((shared ? 'shared:' : 'user:') + key, value); } catch(e){ /* ambiente sem storage disponível */ }
}
async function loadCursoEstrutura(){
  const stored = await storageGet('curso_estrutura', true);
  if (stored){ try { return JSON.parse(stored); } catch(e){ /* dado corrompido, cai para o padrão */ } }
  await storageSet('curso_estrutura', JSON.stringify(DEFAULT_CURSO_ESTRUTURA), true);
  return JSON.parse(JSON.stringify(DEFAULT_CURSO_ESTRUTURA));
}
async function loadProgress(alunoId){
  const stored = await storageGet('progresso_aulas__' + alunoId, true);
  if (stored){ try { return JSON.parse(stored); } catch(e){ /* dado corrompido, cai para o padrão */ } }
  await storageSet('progresso_aulas__' + alunoId, JSON.stringify(DEFAULT_PROGRESS), true);
  return { ...DEFAULT_PROGRESS };
}
async function loadProvas(){
  const stored = await storageGet('provas', true);
  if (stored){ try { return JSON.parse(stored); } catch(e){ /* dado corrompido */ } }
  return [];
}
async function loadRespostasProvas(alunoId){
  const stored = await storageGet('provas_respondidas__' + alunoId, true);
  if (stored){ try { return JSON.parse(stored); } catch(e){ /* dado corrompido */ } }
  return {};
}

function renderBar(pct, totalBlocks){
  const filled = Math.round((pct / 100) * totalBlocks);
  return '█'.repeat(filled) + '░'.repeat(totalBlocks - filled);
}

async function initPage(){
  const CURSO = await loadCursoEstrutura();
  const params = new URLSearchParams(window.location.search);
  const materiaId = params.get('materia');
  const alunoId = params.get('aluno') || 'aluno-demo';

  let materia = null, modulo = null;
  for (const mod of CURSO.modulos){
    const found = mod.materias.find(m => m.id === materiaId);
    if (found){ materia = found; modulo = mod; break; }
  }
  if (!materia){ modulo = CURSO.modulos[0]; materia = modulo.materias[0]; }

  document.getElementById('modLabel').textContent = modulo.nome;
  document.getElementById('matTitle').textContent = materia.nome;
  document.getElementById('backLink').href = 'curso.html?modulo=' + modulo.id + '&aluno=' + encodeURIComponent(alunoId);

  const progress = await loadProgress(alunoId);
  const matPct = Math.round(materia.aulas.reduce((sum, a) => sum + (progress[a.id] || 0), 0) / materia.aulas.length);
  document.getElementById('progressLabel').textContent = 'Progresso da matéria: ' + matPct + '%';
  document.getElementById('asciiBar').textContent = renderBar(matPct, 19);
  document.getElementById('pctLabel').textContent = matPct + '%';

  const list = document.getElementById('aulaList');
  materia.aulas.forEach((a, i) => {
    const pct = progress[a.id] || 0;
    let statusText, statusClass;
    if (pct >= 100){ statusText = '100% concluída ✓'; statusClass = 'done'; }
    else if (pct > 0){ statusText = pct + '% concluída'; statusClass = ''; }
    else { statusText = 'Não iniciada'; statusClass = 'not-started'; }

    const card = document.createElement('a');
    card.className = 'aula-card';
    card.href = 'aula.html?aula=' + a.id + '&aluno=' + encodeURIComponent(alunoId);
    card.innerHTML =
      '<span class="aula-icon">🎬</span>' +
      '<div class="aula-info"><div class="atitle">Aula ' + (i + 1) + ' — ' + a.nome + '</div><div class="astatus ' + statusClass + '">' + statusText + (a.duracao ? ' · ' + a.duracao : '') + '</div></div>' +
      '<span class="aula-arrow">→</span>';
    list.appendChild(card);
  });

  // Prova vinculada a esta matéria (cobre todas as aulas dela), se existir.
  const provaSection = document.getElementById('provaSection');
  const provas = await loadProvas();
  const prova = provas.find(p => p.materiaId === materia.id);

  if (!prova){
    provaSection.innerHTML = '<div class="empty-note">Nenhuma prova disponível para esta matéria ainda.</div>';
  } else {
    const respostas = await loadRespostasProvas(alunoId);
    const anterior = respostas[prova.id];
    let notaHtml = '';
    if (anterior){
      const notaDecimal = (anterior.nota / 10).toFixed(1);
      const aprovado = anterior.nota >= 70;
      notaHtml = '<span class="prova-nota">Sua última nota: ' + notaDecimal + '/10 · ' + (aprovado ? 'Aprovado' : 'Abaixo da média') + '</span><br>';
    }
    provaSection.innerHTML =
      notaHtml +
      '<h4>' + prova.tituloProva + '</h4>' +
      '<p>' + prova.perguntas.length + ' pergunta(s) de múltipla escolha · correção automática · média para aprovação: 7,0</p>' +
      '<a href="prova-aluno.html?prova=' + prova.id + '&aluno=' + encodeURIComponent(alunoId) + '">' + (anterior ? 'Refazer prova' : 'Fazer prova') + '</a>';
  }
}
initPage();
</script>
</body>
</html>
