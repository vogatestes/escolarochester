<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Curso — Nome do Curso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12162A; --paper:#F7F4EC; --paper-2:#EDE7D6;
  --gold:#B8912B; --gold-soft:#D9BC6E; --teal:#1F5F5B; --teal-dark:#12403D;
  --text:#22263D; --muted:#666B80; --line:rgba(18,22,42,0.13); --line-strong:rgba(18,22,42,0.22);
  --radius:16px; --radius-lg:22px;
  --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
body{margin:0; font-family:var(--font-body); color:var(--text); background:var(--paper); min-height:100vh;}
h1,h2{font-family:var(--font-display); margin:0; color:var(--ink);}
a{color:inherit; text-decoration:none;}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; } }

.topbar{display:flex; align-items:center; justify-content:space-between; padding:26px 40px;}
.brand{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:600; font-size:18px;}
.brand .dot{color:var(--gold); font-size:22px; line-height:0;}
.logout-link{font-size:13.5px; font-weight:600; color:var(--muted);}
.logout-link:hover{color:var(--ink);}

.wrap{max-width:620px; margin:0 auto; padding:20px 24px 80px;}
.back-row{margin-bottom:20px;}
.back-row a{font-size:13.5px; font-weight:600; color:var(--muted); display:inline-flex; align-items:center; gap:6px;}
.back-row a:hover{color:var(--ink);}

.mod-header{margin-bottom:26px;}
.mod-header .eyebrow{font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--teal-dark); font-weight:600;}
.mod-header h1{font-size:clamp(22px,3.2vw,28px); font-weight:600; margin-top:10px;}

.progress-card{background:#fff; border:1px solid var(--line); border-radius:var(--radius-lg); padding:22px 24px; margin-bottom:30px;}
.progress-card .plabel{font-size:13.5px; color:var(--muted); margin-bottom:10px; font-weight:600;}
.ascii-bar{font-family:var(--font-mono); font-size:17px; letter-spacing:1px; color:var(--teal); display:flex; align-items:baseline; gap:10px;}
.ascii-bar .pct-num{color:var(--ink); font-size:14px; font-weight:700;}

.materia-list{display:flex; flex-direction:column; gap:12px;}
.materia-card{
  display:flex; align-items:center; gap:16px; background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 20px; transition:transform .15s ease, box-shadow .15s ease;
}
.materia-card:hover{transform:translateY(-3px); box-shadow:0 18px 36px -24px rgba(18,22,42,0.35);}
.materia-icon{font-size:22px; flex-shrink:0;}
.materia-info{flex:1;}
.materia-info .mtitle{font-size:15.5px; font-weight:600; color:var(--ink);}
.materia-info .mstatus{font-size:13px; color:var(--muted); margin-top:3px;}
.materia-info .mstatus.done{color:var(--teal-dark); font-weight:600;}
.materia-info .mstatus.not-started{color:var(--muted); font-style:italic;}
.materia-arrow{color:var(--muted); font-size:18px; flex-shrink:0;}

@media (max-width:560px){
  .topbar{padding:20px 22px;}
  .wrap{padding:10px 20px 60px;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot">•</span>Nome do Curso</div>
  <a href="index.html" class="logout-link">Sair</a>
</div>

<div class="wrap">
  <div class="back-row"><a href="dashboard.html">← Voltar ao dashboard</a></div>

  <div class="mod-header">
    <span class="eyebrow">Módulo atual</span>
    <h1 id="modTitle">Módulo 1 — Fundamentos</h1>
  </div>

  <div class="progress-card">
    <div class="plabel" id="progressLabel">Progresso do módulo: 65%</div>
    <div class="ascii-bar"><span id="asciiBar">█████████████░░░░░</span><span class="pct-num" id="pctLabel">65%</span></div>
  </div>

  <div class="materia-list" id="materiaList"></div>
</div>

<script>
/* ============ MODELO DE DADOS ============
   Aluno -> possui uma Matrícula -> vinculada a um Curso -> que possui Módulos -> que possuem Matérias
   Aluno possui Progresso individual em cada Matéria (fonte única de verdade; tudo acima é calculado a partir daqui). */
const ALUNO = { id:'aluno-1', nome:'Nome do Aluno', email:'aluno@email.com' };

const CURSO = {
  id:'curso-1', nome:'Nome do Curso',
  modulos:[
    { id:'mod-1', nome:'Fundamentos', materias:[
        { id:'mod-1-mat-1', nome:'Introdução' },
        { id:'mod-1-mat-2', nome:'Fundamentos' },
        { id:'mod-1-mat-3', nome:'Prática' },
        { id:'mod-1-mat-4', nome:'Projeto' }
    ]},
    { id:'mod-2', nome:'Ferramentas e prática', materias:[
        { id:'mod-2-mat-1', nome:'Configuração do ambiente' },
        { id:'mod-2-mat-2', nome:'Prática guiada' },
        { id:'mod-2-mat-3', nome:'Estudo de caso' },
        { id:'mod-2-mat-4', nome:'Erros comuns' },
        { id:'mod-2-mat-5', nome:'Exercício prático' }
    ]},
    { id:'mod-3', nome:'Projeto aplicado', materias:[
        { id:'mod-3-mat-1', nome:'Planejamento' },
        { id:'mod-3-mat-2', nome:'Desenvolvimento (parte 1)' },
        { id:'mod-3-mat-3', nome:'Desenvolvimento (parte 2)' },
        { id:'mod-3-mat-4', nome:'Revisão final' }
    ]},
    { id:'mod-4', nome:'Avançado', materias:[
        { id:'mod-4-mat-1', nome:'Tópico avançado 1' },
        { id:'mod-4-mat-2', nome:'Tópico avançado 2' },
        { id:'mod-4-mat-3', nome:'Tópico avançado 3' },
        { id:'mod-4-mat-4', nome:'Boas práticas' },
        { id:'mod-4-mat-5', nome:'Exercício prático' }
    ]},
    { id:'mod-5', nome:'[Nome do módulo 5]', materias:[ { id:'mod-5-mat-1', nome:'[Matéria a definir]' } ]},
    { id:'mod-6', nome:'[Nome do módulo 6]', materias:[ { id:'mod-6-mat-1', nome:'[Matéria a definir]' } ]}
  ]
};

const MATRICULA = { id:'matricula-1', alunoId:ALUNO.id, cursoId:CURSO.id, acessoValidoMeses:18 };

// Progresso padrão de demonstração (0-100 por matéria) — usado apenas para semear o storage na primeira visita.
const DEFAULT_PROGRESS = {
  'mod-1-mat-1':80, 'mod-1-mat-2':45, 'mod-1-mat-3':100, 'mod-1-mat-4':0,
  'mod-2-mat-1':100, 'mod-2-mat-2':20, 'mod-2-mat-3':0, 'mod-2-mat-4':0, 'mod-2-mat-5':0,
  'mod-3-mat-1':0, 'mod-3-mat-2':0, 'mod-3-mat-3':0, 'mod-3-mat-4':0,
  'mod-4-mat-1':0, 'mod-4-mat-2':0, 'mod-4-mat-3':0, 'mod-4-mat-4':0, 'mod-4-mat-5':0,
  'mod-5-mat-1':0,
  'mod-6-mat-1':0
};

async function storageGet(key, shared){
  if (window.storage){
    try { const res = await window.storage.get(key, shared); return res ? res.value : null; }
    catch(e){ return null; }
  }
  try { return localStorage.getItem((shared ? 'shared:' : 'user:') + key); } catch(e){ return null; }
}
async function storageSet(key, value, shared){
  if (window.storage){
    try { await window.storage.set(key, value, shared); return; } catch(e){ /* cai para localStorage abaixo */ }
  }
  try { localStorage.setItem((shared ? 'shared:' : 'user:') + key, value); } catch(e){ /* ambiente sem storage disponível */ }
}

async function loadProgress(){
  const stored = await storageGet('progresso_materias', false);
  if (stored){
    try { return JSON.parse(stored); } catch(e){ /* dado corrompido, cai para o padrão */ }
  }
  await storageSet('progresso_materias', JSON.stringify(DEFAULT_PROGRESS), false);
  return { ...DEFAULT_PROGRESS };
}

const params = new URLSearchParams(window.location.search);
const modId = params.get('modulo') || 'mod-1';
const modulo = CURSO.modulos.find(m => m.id === modId || m.id === 'mod-' + modId) || CURSO.modulos[0];

document.getElementById('modTitle').textContent = modulo.nome;

function renderBar(pct, totalBlocks){
  const filled = Math.round((pct / 100) * totalBlocks);
  return '█'.repeat(filled) + '░'.repeat(totalBlocks - filled);
}

loadProgress().then(progress => {
  const modulePct = Math.round(
    modulo.materias.reduce((sum, m) => sum + (progress[m.id] || 0), 0) / modulo.materias.length
  );
  document.getElementById('progressLabel').textContent = 'Progresso do módulo: ' + modulePct + '%';
  document.getElementById('asciiBar').textContent = renderBar(modulePct, 19);
  document.getElementById('pctLabel').textContent = modulePct + '%';

  const list = document.getElementById('materiaList');
  modulo.materias.forEach((m, i) => {
    const pct = progress[m.id] || 0;
    let statusText, statusClass;
    if (pct >= 100){ statusText = '100% concluído ✓'; statusClass = 'done'; }
    else if (pct > 0){ statusText = pct + '% concluído'; statusClass = ''; }
    else { statusText = 'Não iniciado'; statusClass = 'not-started'; }

    const card = document.createElement('a');
    card.className = 'materia-card';
    card.href = 'materia.html?materia=' + m.id;
    card.innerHTML =
      '<span class="materia-icon">📚</span>' +
      '<div class="materia-info"><div class="mtitle">Matéria ' + (i + 1) + ' — ' + m.nome + '</div><div class="mstatus ' + statusClass + '">' + statusText + '</div></div>' +
      '<span class="materia-arrow">→</span>';
    list.appendChild(card);
  });
});
</script>
</body>
</html>
