<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel do coordenador — Nome do Curso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12162A; --paper:#F7F4EC; --paper-2:#EDE7D6;
  --gold:#B8912B; --gold-soft:#D9BC6E; --teal:#1F5F5B; --teal-dark:#12403D;
  --text:#22263D; --muted:#666B80; --line:rgba(18,22,42,0.13); --line-strong:rgba(18,22,42,0.22);
  --error:#B3423A; --error-bg:#FBEBEA; --warn:#8A5A0B; --warn-bg:#FBF0DD;
  --radius:14px; --radius-lg:22px;
  --font-display:'Fraunces', serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
body{margin:0; font-family:var(--font-body); color:var(--text); background:var(--paper); min-height:100vh;}
h1,h2{font-family:var(--font-display); margin:0; color:var(--ink);}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; } }

.topbar{display:flex; align-items:center; justify-content:space-between; padding:24px 40px; border-bottom:1px solid var(--line);}
.brand{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:600; font-size:18px;}
.brand .dot{color:var(--gold); font-size:22px; line-height:0;}
.logout-link{font-size:13.5px; font-weight:600; color:var(--muted);}
.logout-link:hover{color:var(--ink);}

.wrap{max-width:760px; margin:0 auto; padding:36px 24px 80px;}
.wrap h1{font-size:26px; font-weight:600;}
.wrap > p.sub{color:var(--muted); font-size:14.5px; margin-top:8px;}

.locked-view{max-width:420px; margin:80px auto; text-align:center;}
.locked-view .icon{font-size:34px; margin-bottom:14px;}
.locked-view p{color:var(--muted); font-size:14.5px; margin-top:10px;}
.locked-view input{
  width:100%; margin-top:20px; padding:14px 16px; border-radius:10px; border:1.5px solid var(--line-strong);
  font-size:15px; text-align:center;
}
.locked-view button{
  width:100%; margin-top:14px; padding:14px; border:none; border-radius:10px; background:var(--teal); color:#fff;
  font-weight:700; font-size:15px;
}
.locked-error{color:var(--error); font-size:13.5px; margin-top:10px; display:none;}
.locked-error.show{display:block;}

.section-title{font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--teal-dark);
  font-weight:600; margin:34px 0 14px;}
.section-title:first-of-type{margin-top:0;}

.prof-card{
  display:flex; align-items:center; gap:16px; background:#fff; border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; margin-bottom:10px; flex-wrap:wrap;
}
.prof-avatar{width:40px;height:40px;border-radius:50%; background:var(--paper-2); color:var(--ink); font-weight:700; font-size:14px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.prof-info{flex:1; min-width:180px;}
.prof-info .pname{font-size:15px; font-weight:600; color:var(--ink);}
.prof-info .pmeta{font-size:13px; color:var(--muted); margin-top:2px;}
.prof-actions{display:flex; gap:8px;}
.prof-actions button{
  padding:9px 16px; border-radius:999px; font-size:13px; font-weight:700; border:1.5px solid var(--line-strong); background:#fff; color:var(--text);
}
.btn-approve{background:var(--teal) !important; border-color:var(--teal) !important; color:#fff !important;}
.btn-reject{color:var(--error) !important; border-color:rgba(179,66,58,0.4) !important;}
.status-badge{font-family:var(--font-mono); font-size:11px; padding:5px 10px; border-radius:999px; font-weight:600;}
.status-badge.aprovado{background:rgba(87,217,163,0.15); color:var(--teal-dark);}
.status-badge.recusado{background:var(--error-bg); color:var(--error);}
.empty-note{color:var(--muted); font-size:14px; padding:14px 0;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot">•</span>Nome do Curso</div>
  <a href="index.html" class="logout-link">Sair</a>
</div>

<div class="locked-view" id="lockedView">
  <div class="icon">🔒</div>
  <h1 style="font-size:22px;">Painel do coordenador</h1>
  <p>Digite a senha do coordenador para acessar as aprovações.</p>
  <input type="password" id="passInput" placeholder="Senha do coordenador">
  <div class="locked-error" id="passError">Senha incorreta. Tente novamente.</div>
  <button id="unlockBtn">Entrar</button>
</div>

<div class="wrap" id="panelView" style="display:none;">
  <h1>Painel do coordenador</h1>
  <p class="sub">Aprove ou recuse os cadastros de professores enviados pela página de cadastro.</p>

  <div class="section-title">Pendentes de aprovação</div>
  <div id="pendentesList"></div>

  <div class="section-title">Aprovados</div>
  <div id="aprovadosList"></div>

  <div class="section-title">Recusados</div>
  <div id="recusadosList"></div>
</div>

<script>
async function storageGet(key, shared){
  if (window.storage){
    try { const res = await window.storage.get(key, shared); return res ? res.value : null; }
    catch(e){ return null; }
  }
  try { return localStorage.getItem((shared ? 'shared:' : 'user:') + key); } catch(e){ return null; }
}
async function storageSet(key, value, shared){
  if (window.storage){
    try { await window.storage.set(key, value, shared); return; } catch(e){ /* cai para localStorage abaixo */ }
  }
  try { localStorage.setItem((shared ? 'shared:' : 'user:') + key, value); } catch(e){ /* ambiente sem storage disponível */ }
}
const DEFAULT_ADMIN_PASSWORD = 'admin123';
async function getStoredPassword(){
  const stored = await storageGet('admin_password', true);
  return stored || DEFAULT_ADMIN_PASSWORD;
}
async function loadProfessores(){
  const stored = await storageGet('professores', true);
  if (stored){ try { return JSON.parse(stored); } catch(e){ /* dado corrompido */ } }
  return [];
}
async function saveProfessores(list){
  await storageSet('professores', JSON.stringify(list), true);
}

function initials(nome){
  return nome.trim().split(/\s+/).slice(0,2).map(p => p[0].toUpperCase()).join('');
}

async function renderPanel(){
  const professores = await loadProfessores();
  const pendentes = professores.filter(p => p.status === 'pendente');
  const aprovados = professores.filter(p => p.status === 'aprovado');
  const recusados = professores.filter(p => p.status === 'recusado');

  const pendentesList = document.getElementById('pendentesList');
  const aprovadosList = document.getElementById('aprovadosList');
  const recusadosList = document.getElementById('recusadosList');
  pendentesList.innerHTML = ''; aprovadosList.innerHTML = ''; recusadosList.innerHTML = '';

  if (pendentes.length === 0){
    pendentesList.innerHTML = '<div class="empty-note">Nenhum cadastro pendente no momento.</div>';
  }
  pendentes.forEach(p => {
    const card = document.createElement('div');
    card.className = 'prof-card';
    card.innerHTML =
      '<div class="prof-avatar">' + initials(p.nome) + '</div>' +
      '<div class="prof-info"><div class="pname">' + p.nome + '</div><div class="pmeta">' + p.email + ' · ' + p.materia + '</div></div>' +
      '<div class="prof-actions"><button class="btn-approve" data-action="aprovar" data-id="' + p.id + '">Aprovar</button><button class="btn-reject" data-action="recusar" data-id="' + p.id + '">Recusar</button></div>';
    pendentesList.appendChild(card);
  });

  if (aprovados.length === 0){
    aprovadosList.innerHTML = '<div class="empty-note">Nenhum professor aprovado ainda.</div>';
  }
  aprovados.forEach(p => {
    const card = document.createElement('div');
    card.className = 'prof-card';
    card.innerHTML =
      '<div class="prof-avatar">' + initials(p.nome) + '</div>' +
      '<div class="prof-info"><div class="pname">' + p.nome + '</div><div class="pmeta">' + p.email + ' · ' + p.materia + '</div></div>' +
      '<span class="status-badge aprovado">Aprovado</span>';
    aprovadosList.appendChild(card);
  });

  if (recusados.length === 0){
    recusadosList.innerHTML = '<div class="empty-note">Nenhum cadastro recusado.</div>';
  }
  recusados.forEach(p => {
    const card = document.createElement('div');
    card.className = 'prof-card';
    card.innerHTML =
      '<div class="prof-avatar">' + initials(p.nome) + '</div>' +
      '<div class="prof-info"><div class="pname">' + p.nome + '</div><div class="pmeta">' + p.email + ' · ' + p.materia + '</div></div>' +
      '<span class="status-badge recusado">Recusado</span>';
    recusadosList.appendChild(card);
  });

  document.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-id');
      const action = btn.getAttribute('data-action');
      const list = await loadProfessores();
      const prof = list.find(p => p.id === id);
      if (prof) prof.status = action === 'aprovar' ? 'aprovado' : 'recusado';
      await saveProfessores(list);
      renderPanel();
    });
  });
}

document.getElementById('unlockBtn').addEventListener('click', async () => {
  const pass = document.getElementById('passInput').value;
  const stored = await getStoredPassword();
  if (pass === stored){
    document.getElementById('lockedView').style.display = 'none';
    document.getElementById('panelView').style.display = 'block';
    renderPanel();
  } else {
    document.getElementById('passError').classList.add('show');
  }
});
document.getElementById('passInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('unlockBtn').click();
});
</script>
</body>
</html>
